<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EDEEF4"/>
      <stop offset="55%" stop-color="#C9F24D"/>
      <stop offset="100%" stop-color="#7C6CFF"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#7C6CFF" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#7C6CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#C9F24D" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#C9F24D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#232536" stroke-width="1" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1200" height="630" fill="#0A0B12"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- node graph motif (top-right) -->
  <g stroke="#7C6CFF" stroke-opacity="0.5" stroke-width="1.4">
    <line x1="980" y1="120" x2="1080" y2="180"/>
    <line x1="1080" y1="180" x2="1010" y2="270"/>
    <line x1="1010" y1="270" x2="900" y2="230"/>
    <line x1="900" y1="230" x2="980" y2="120"/>
    <line x1="1080" y1="180" x2="1150" y2="110"/>
  </g>
  <g fill="#C9F24D">
    <circle cx="980" cy="120" r="5"/>
    <circle cx="1080" cy="180" r="6"/>
    <circle cx="1010" cy="270" r="4"/>
    <circle cx="900" cy="230" r="5"/>
    <circle cx="1150" cy="110" r="4"/>
  </g>

  <!-- status chip -->
  <g transform="translate(90,150)">
    <rect x="0" y="0" width="360" height="40" rx="20" fill="#12131C" stroke="#232536"/>
    <circle cx="24" cy="20" r="5" fill="#C9F24D"/>
    <text x="44" y="26" font-family="'JetBrains Mono', monospace" font-size="15" fill="#9A9DB2" letter-spacing="1">AI-AUGMENTED FULL STACK DEVELOPER</text>
  </g>

  <!-- name -->
  <text x="88" y="320" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="118" font-weight="700" fill="#EDEEF4" letter-spacing="-3">Akash Anand.</text>

  <!-- tagline -->
  <text x="90" y="400" font-family="'Space Grotesk', 'Segoe UI', sans-serif" font-size="42" font-weight="600" letter-spacing="-1">
    <tspan fill="url(#ink)">Engineering, at the seam of full-stack &amp; agentic AI.</tspan>
  </text>

  <!-- stack row -->
  <g font-family="'JetBrains Mono', monospace" font-size="18" fill="#9A9DB2">
    <text x="90" y="500" fill="#C9F24D" letter-spacing="2">AGENTIC STACK</text>
  </g>
  <g transform="translate(90,520)" font-family="'JetBrains Mono', monospace" font-size="17" fill="#EDEEF4">
    <g>
      <rect x="0" y="0" width="110" height="38" rx="19" fill="#0A0B12" stroke="#232536"/>
      <text x="55" y="24" text-anchor="middle">Claude</text>
    </g>
    <g transform="translate(122,0)">
      <rect x="0" y="0" width="104" height="38" rx="19" fill="#0A0B12" stroke="#232536"/>
      <text x="52" y="24" text-anchor="middle">Codex</text>
    </g>
    <g transform="translate(238,0)">
      <rect x="0" y="0" width="78" height="38" rx="19" fill="#0A0B12" stroke="#232536"/>
      <text x="39" y="24" text-anchor="middle">n8n</text>
    </g>
    <g transform="translate(328,0)">
      <rect x="0" y="0" width="78" height="38" rx="19" fill="#0A0B12" stroke="#232536"/>
      <text x="39" y="24" text-anchor="middle">MCP</text>
    </g>
    <g transform="translate(418,0)">
      <rect x="0" y="0" width="132" height="38" rx="19" fill="#0A0B12" stroke="#232536"/>
      <text x="66" y="24" text-anchor="middle">ElevenLabs</text>
    </g>
  </g>

  <!-- monogram -->
  <g transform="translate(1010,470)">
    <rect x="0" y="0" width="100" height="100" rx="22" fill="#12131C" stroke="#232536"/>
    <path d="M28 74 L50 30 L72 74" fill="none" stroke="#C9F24D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="82" cy="34" r="7" fill="#7C6CFF"/>
  </g>
</svg>
